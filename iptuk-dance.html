<title>입툭이 댄스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one stage card (canvas) with a beat strip under it and a compact control row. */
:root {
  --bg: #f3eefb;
  --stage: #2a2240;
  --stage-2: #3b3060;
  --fg: #231c33;
  --muted: #6c6383;
  --accent: #ff5c8a;
  --accent-2: #ffd23f;
  --chip: #e6def5;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15111f; --stage: #221b35; --stage-2: #33295a; --fg: #f1ecfa;
    --muted: #a59cbd; --accent: #ff7aa0; --accent-2: #ffd84f; --chip: #2a2340; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15111f; --stage: #221b35; --stage-2: #33295a; --fg: #f1ecfa;
  --muted: #a59cbd; --accent: #ff7aa0; --accent-2: #ffd84f; --chip: #2a2340; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
.stage {
  position: relative; border-radius: 22px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--stage-2), var(--stage));
  aspect-ratio: 1 / 1; max-width: 100%;
}
canvas { width: 100%; height: 100%; display: block; }
.move {
  position: absolute; left: 14px; top: 12px;
  font-family: var(--display); font-size: 1.15rem; color: #fff;
  background: rgba(0,0,0,.28); padding: 4px 12px; border-radius: 999px;
}
.beats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.beat {
  font-family: var(--display); text-align: center; padding: 8px 0; border-radius: 10px;
  background: var(--chip); color: var(--muted); font-variant-numeric: tabular-nums;
  transition: background .08s, color .08s, transform .08s;
}
.beat.on { background: var(--accent); color: #fff; transform: translateY(-2px); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button {
  font-family: var(--display); font-size: 1rem; border: 0; cursor: pointer;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px;
}
button.ghost { background: var(--chip); color: var(--fg); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.bpm { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 0; color: var(--muted); }
.bpm input { flex: 1; min-width: 0; accent-color: var(--accent); }
.bpm b { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.2em; }
ol { margin: 0; padding-left: 1.3em; color: var(--muted); line-height: 1.7; }
ol li.now { color: var(--fg); font-weight: 700; }
.note { font-size: .85rem; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <h1>입툭이 <span>챌린지</span></h1>
  <p class="sub">노래를 따로 틀어놓고 BPM을 맞추면 입툭이가 박자에 맞춰 춰요. 8카운트 × 2 루틴이 반복돼요.</p>

  <div class="stage">
    <canvas id="cv" width="800" height="800" aria-label="춤추는 입툭이"></canvas>
    <div class="move" id="moveName">어깨 들썩</div>
  </div>

  <div class="beats" id="beats"></div>

  <div class="controls">
    <button id="play">일시정지</button>
    <button class="ghost" id="tap">탭으로 BPM</button>
    <label class="bpm" for="bpmIn">BPM <input id="bpmIn" type="range" min="70" max="160" value="112"><b id="bpmOut">112</b></label>
  </div>

  <ol id="moves">
    <li>어깨 들썩 · 허리에 손, 박자마다 바운스</li>
    <li>손가락 포인트 · 오른쪽 위, 왼쪽 위, 만세, 바닥 콕</li>
    <li>골반 웨이브 · 두 팔 머리 위로, 좌우로 흔들기</li>
    <li>턴 &amp; 입툭 · 한 바퀴 돌고 입 내밀며 윙크</li>
  </ol>
  <p class="note">탭으로 BPM: 노래 박자에 맞춰 버튼을 4번 이상 눌러보세요.</p>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 800, H = 800;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const base = {bx:0,by:0,tilt:0,la:.25,lb:0,ra:.25,rb:0,ll:.15,rl:.15,lip:.6,eye:0,sx:1};
  const K = (o) => Object.assign({}, base, o);
  const hips = {la:.9,lb:-2.1,ra:.9,rb:-2.1};
  const kiss = {ra:1.0,rb:-3.3,la:2.5,lb:.3,lip:1.6,eye:1};
  const frames = [
    K({...hips,by:14,tilt:-.08}), K({...hips,by:0,tilt:.08}), K({...hips,by:14,tilt:-.08}), K({...hips,by:0,tilt:.08,lip:1.1}),
    K({la:.9,lb:-2.1,ra:2.4,rb:0,tilt:.12,bx:14}), K({ra:.9,rb:-2.1,la:2.4,lb:0,tilt:-.12,bx:-14}),
    K({la:2.5,lb:0,ra:2.5,rb:0,by:6,lip:1}), K({ra:1.2,rb:-.5,la:.35,by:16,lip:1.2}),
    K({la:2.8,lb:.4,ra:2.6,rb:-.4,bx:22,tilt:-.15,rl:.4}), K({la:2.6,lb:-.4,ra:2.8,rb:.4,bx:-22,tilt:.15,ll:.4}),
    K({la:2.8,lb:.4,ra:2.6,rb:-.4,bx:22,tilt:-.15,rl:.4}), K({la:2.6,lb:-.4,ra:2.8,rb:.4,bx:-22,tilt:.15,ll:.4}),
    K({la:.15,ra:.15,by:6}), K({la:1.5,ra:1.5,sx:-1,by:-4}), K({...kiss}), K({...kiss,by:5,tilt:.05})
  ];
  const moveNames = ['어깨 들썩','손가락 포인트','골반 웨이브','턴 & 입툭'];

  const beatsEl = document.getElementById('beats');
  for (let i = 1; i <= 8; i++) { const d = document.createElement('div'); d.className = 'beat'; d.textContent = i; beatsEl.appendChild(d); }
  const beatDivs = [...beatsEl.children];
  const movesLis = [...document.querySelectorAll('#moves li')];
  const moveName = document.getElementById('moveName');

  let bpm = 112, playing = !reduce, beatPos = 0, last = performance.now();
  const bpmIn = document.getElementById('bpmIn'), bpmOut = document.getElementById('bpmOut');
  const setBpm = v => { bpm = Math.max(70, Math.min(160, Math.round(v))); bpmIn.value = bpm; bpmOut.textContent = bpm; };
  bpmIn.addEventListener('input', () => setBpm(+bpmIn.value));
  const playBtn = document.getElementById('play');
  const syncBtn = () => playBtn.textContent = playing ? '일시정지' : '재생';
  playBtn.addEventListener('click', () => { playing = !playing; syncBtn(); });
  syncBtn();
  let taps = [];
  document.getElementById('tap').addEventListener('click', () => {
    const t = performance.now();
    taps = taps.filter(x => t - x < 3000); taps.push(t);
    if (taps.length >= 4) {
      const iv = (taps[taps.length-1] - taps[0]) / (taps.length - 1);
      setBpm(60000 / iv); beatPos = Math.round(beatPos);
    }
  });

  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const lerp = (a,b,t) => a + (b-a)*t;
  function poseAt(p) {
    const i = Math.floor(p) % 16, j = (i + 1) % 16;
    const f = p - Math.floor(p);
    // snap into each pose in the first ~45% of the beat, then hold (hit-the-beat feel)
    const t = ease(Math.min(1, f / .45));
    const a = frames[i], b = frames[j], o = {};
    for (const k in base) o[k] = lerp(a[k], b[k], t);
    o.hop = Math.sin(Math.min(1, f/.45) * Math.PI) * 10;
    return o;
  }

  function limb(x, y, a1, a2, l1, l2, side, color, w) {
    const ex = x + side*Math.sin(a1)*l1, ey = y + Math.cos(a1)*l1;
    const a = a1 + a2;
    const hx = ex + side*Math.sin(a)*l2, hy = ey + Math.cos(a)*l2;
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(hx, hy, w*.62, 0, Math.PI*2); ctx.fill();
  }

  const BODY = '#ffe36e', BODY_D = '#e9c440', LINE = '#3a2a1a', LIP = '#ff6f91', LIP_D = '#d94a72';

  function draw(p, beatFrac) {
    ctx.clearRect(0, 0, W, H);
    // floor + spotlight
    const g = ctx.createRadialGradient(400, 690, 20, 400, 690, 300);
    g.addColorStop(0, 'rgba(255,230,140,.35)'); g.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(400, 690, 300, 70, 0, 0, Math.PI*2); ctx.fill();
    // beat ring pulse
    const pulse = 1 - beatFrac;
    ctx.strokeStyle = `rgba(255,92,138,${.5*pulse})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(400 + p.bx, 690, 150 + 60*(1-pulse), 32 + 12*(1-pulse), 0, 0, Math.PI*2); ctx.stroke();

    const cx = 400 + p.bx, cy = 430 + p.by - p.hop;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(400 + p.bx, 690, 120 - p.hop*2, 22, 0, 0, Math.PI*2); ctx.fill();

    // legs (not rotated with tilt, they stay on floor)
    const legY = cy + 120;
    const footY = 680;
    [[-1, p.ll], [1, p.rl]].forEach(([s, a]) => {
      const hx = cx + s*48, fx = hx + s*Math.sin(a)*(footY-legY);
      ctx.strokeStyle = BODY_D; ctx.lineWidth = 34; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx, legY); ctx.lineTo(fx, footY - 12); ctx.stroke();
      ctx.fillStyle = LINE; ctx.beginPath(); ctx.ellipse(fx + s*10, footY - 4, 30, 14, 0, 0, Math.PI*2); ctx.fill();
    });

    ctx.save();
    ctx.translate(cx, cy + 120); ctx.rotate(p.tilt); ctx.translate(0, -120);
    const sx = Math.abs(p.sx) < .08 ? .08*Math.sign(p.sx || 1) : p.sx;
    ctx.scale(sx, 1);
    const facing = p.sx >= 0;

    // arms behind-ish (drawn before body when arm hangs down)
    const sh = 12;
    const armsBack = () => {
      limb(-118, sh, p.la, p.lb, 78, 70, -1, BODY_D, 30);
      limb(118, sh, p.ra, p.rb, 78, 70, 1, BODY_D, 30);
    };

    // body: soft blob
    ctx.fillStyle = BODY; ctx.strokeStyle = LINE; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(0, -170);
    ctx.bezierCurveTo(115, -170, 150, -60, 145, 30);
    ctx.bezierCurveTo(140, 110, 90, 135, 0, 135);
    ctx.bezierCurveTo(-90, 135, -140, 110, -145, 30);
    ctx.bezierCurveTo(-150, -60, -115, -170, 0, -170);
    ctx.fill(); ctx.stroke();
    // belly highlight
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-50, -95, 32, 20, -.5, 0, Math.PI*2); ctx.fill();
    // hair tuft
    ctx.strokeStyle = LINE; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -168); ctx.quadraticCurveTo(10, -205, 34, -200); ctx.stroke();

    armsBack();

    if (facing) {
      // eyes
      ctx.fillStyle = LINE;
      ctx.beginPath(); ctx.ellipse(-50, -55, 13, 18, 0, 0, Math.PI*2); ctx.fill();
      if (p.eye > .5) {
        ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(32, -55); ctx.quadraticCurveTo(50, -72, 68, -55); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.ellipse(50, -55, 13, 18, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(54, -61, 5, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-46, -61, 5, 0, Math.PI*2); ctx.fill();
      // cheeks
      ctx.fillStyle = 'rgba(255,111,145,.45)';
      ctx.beginPath(); ctx.ellipse(-92, -10, 22, 13, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(92, -10, 22, 13, 0, 0, Math.PI*2); ctx.fill();
      // the 툭 lips: pouting out, size follows p.lip
      const L = .7 + p.lip*.35;
      ctx.save(); ctx.translate(0, 10); ctx.scale(L, L);
      ctx.fillStyle = LIP; ctx.strokeStyle = LINE; ctx.lineWidth = 6/L;
      ctx.beginPath();
      ctx.moveTo(-46, 0);
      ctx.bezierCurveTo(-44, -26, -14, -30, 0, -18);
      ctx.bezierCurveTo(14, -30, 44, -26, 46, 0);
      ctx.bezierCurveTo(44, 34, -44, 34, -46, 0);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = LIP_D; ctx.lineWidth = 5/L;
      ctx.beginPath(); ctx.moveTo(-30, 2); ctx.quadraticCurveTo(0, 12, 30, 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-18, 14, 9, 5, -.3, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      // back view: a little tail of hair, no face
      ctx.fillStyle = BODY_D; ctx.beginPath(); ctx.ellipse(0, 40, 50, 36, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // "툭!" pop on the kiss pose
    if (Math.floor(p._b) % 16 >= 14) {
      const k = Math.min(1, (p._b % 16 - 14) / .3);
      ctx.save(); ctx.translate(cx + 160, cy - 150); ctx.scale(k, k); ctx.rotate(-.15);
      ctx.font = '72px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#2a2240'; ctx.strokeText('툭!', 0, 0);
      ctx.fillStyle = '#ffd23f'; ctx.fillText('툭!', 0, 0);
      ctx.restore();
    }
  }

  let lastBeat = -1;
  function frame(now) {
    const dt = Math.max(0, Math.min(100, now - last)); last = now;
    if (playing) beatPos += dt / 60000 * bpm;
    const p = poseAt(beatPos); p._b = beatPos;
    draw(p, beatPos % 1);
    const b = Math.floor(beatPos) % 16;
    if (b !== lastBeat) {
      lastBeat = b;
      beatDivs.forEach((d, i) => d.classList.toggle('on', i === b % 8));
      const m = Math.floor(b / 4);
      moveName.textContent = moveNames[m];
      movesLis.forEach((li, i) => li.classList.toggle('now', i === m));
    }
    requestAnimationFrame(frame);
  }
  document.fonts?.ready.then(() => {});
  requestAnimationFrame(frame);
})();
</script>
